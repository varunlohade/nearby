<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=block" rel="stylesheet">
<script src="common.js"></script>
<style>
:root{--ink:#141414;--ink2:#55524C;--paper:#fff;--cobalt:#3355FF;--tomato:#FF5533;--sun:#FFC933;--mint:#22C58B;--pink:#FF8AD0;--lilac:#9B7BFF;--sky:#5EC8FF;--orange:#FF9A1F;--hard:3px 3px 0 var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#map{position:absolute;inset:0}
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;z-index:20;font-weight:700;font-size:16px}
.sb-right{display:flex;gap:6px;align-items:center}
.num{font-variant-numeric:tabular-nums}
.search{position:absolute;top:56px;left:14px;right:14px;height:52px;border-radius:26px;background:#fff;border:2px solid var(--ink);box-shadow:var(--hard);
  display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;font-size:16.5px;font-weight:500;z-index:10}
.search .grow{flex:1;color:var(--ink2)}
.me{width:38px;height:38px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.note{position:absolute;top:120px;left:14px;z-index:10;display:flex;gap:7px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 11px 6px 9px;font-size:13.5px;font-weight:500;box-shadow:2px 2px 0 var(--ink)}
.note b{font-weight:800}
/* stickers on map */
.tag{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:3px 4px 3px 9px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.tag b{font-size:14px;font-weight:800;letter-spacing:-.01em}
.tag i{font-style:normal;min-width:24px;height:22px;border-radius:11px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.tag.home{background:var(--ink);color:#fff;padding:5px 12px 6px;flex-direction:column;align-items:flex-start;gap:0;border-radius:14px;box-shadow:3px 3px 0 var(--sun)}
.tag.home b{font-size:16px}
.tag.home span{font-size:12.5px;font-weight:500;color:var(--sun)}
.tag.sel{transform:rotate(-3deg) scale(1.08)}
.emo{width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:19px;box-shadow:2px 2px 0 var(--ink);position:relative}
.emo small{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;border-radius:7px;padding:1px 6px;white-space:nowrap}
.build{display:flex;align-items:center;gap:4px;background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:3px 9px 4px 7px;font-size:12.5px;font-weight:700}
/* peek card */
.card{position:absolute;left:12px;right:12px;bottom:26px;z-index:15;background:#fff;border:2px solid var(--ink);border-radius:26px;box-shadow:5px 5px 0 var(--ink);padding:16px 16px 16px}
.chead{display:flex;justify-content:space-between;align-items:flex-start}
.chead h2{font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:.95}
.chead .now{display:flex;align-items:baseline;gap:5px;font-size:14px;font-weight:600;margin-top:7px;color:var(--ink2)}
.chead .now b{font-size:14px;color:var(--ink);font-weight:800}
.sw{width:14px;height:14px;border-radius:5px;border:2px solid var(--ink);display:inline-block;vertical-align:-1px;margin-right:6px}
.big{width:62px;height:62px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;text-align:center;transform:rotate(8deg);flex:none;box-shadow:2px 2px 0 var(--ink)}
.big b{display:block;font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big span{display:block;font-size:10.5px;font-weight:700;line-height:1.1}
.say{margin-top:14px;display:flex;gap:10px;align-items:flex-end}
.av{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.bub{background:#fff;border:2px solid var(--ink);border-radius:18px 18px 18px 6px;padding:8px 12px 9px;font-size:15.5px;line-height:1.3}
.bub small{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:1px}
.tix{margin-top:12px;display:flex;border:2px solid var(--ink);border-radius:16px;overflow:hidden;position:relative}
.tix .stub{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px dashed var(--ink);padding:6px 0}
.tix .stub em{font-style:normal;font-size:22px;line-height:1.1}
.tix .stub b{font-size:12.5px;font-weight:800}
.tix .info{padding:9px 12px 10px;flex:1;min-width:0}
.tix .info b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}
.tix .info span{display:block;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;height:52px;border-radius:16px;border:2px solid var(--ink);display:grid;place-items:center;font-size:17px;font-weight:800;box-shadow:var(--hard);letter-spacing:-.01em}
.btn.ink{background:var(--ink);color:#fff;box-shadow:3px 3px 0 var(--tomato)}
.btn.tomato{background:var(--tomato);color:#fff}
.btn.small{flex:none;width:52px}
/* build */
.card.tall{padding:20px 18px 18px}
.card h1{font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:.95}
.lede{font-size:15.5px;color:var(--ink2);margin-top:8px;line-height:1.35}
.lbl{font-size:13px;font-weight:800;margin:16px 0 6px}
.in{height:58px;border:2px solid var(--ink);border-radius:16px;display:flex;align-items:center;padding:0 14px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.caret{width:2.5px;height:26px;background:var(--tomato);margin-left:2px}
.sws{display:flex;gap:10px}
.sws div{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink)}
.sws div.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.priv{margin-top:16px;background:#FFF1BF;border:2px solid var(--ink);border-radius:16px;padding:11px 13px;font-size:14.5px;line-height:1.35;display:flex;gap:10px}
.priv b{font-weight:800}
.x{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:#fff;flex:none}
/* chat */
.chat{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column}
.ch-top{background:var(--sun);border-bottom:2px solid var(--ink);padding:56px 16px 16px;display:flex;gap:12px;align-items:center}
.ch-top .back{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;flex:none;box-shadow:2px 2px 0 var(--ink)}
.ch-top .t{flex:1}
.ch-top h2{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1}
.ch-top span{font-size:14px;font-weight:600;display:block;margin-top:3px}
.msgs{flex:1;padding:14px 14px 104px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;overflow:hidden}
.msgs>*{flex-shrink:0}
.row{display:flex;gap:8px;align-items:flex-end;max-width:86%;width:fit-content}
.row .av{width:30px;height:30px;font-size:12px}
.row .bub{font-size:16px}
.row.mine{align-self:flex-end;max-width:290px}
.row.mine .bub{background:var(--cobalt);color:#fff;border-radius:18px 18px 6px 18px}
.who{font-size:12.5px;font-weight:700;color:var(--ink2);margin:8px 0 0 40px}
.evt{margin:6px 0 4px 38px;width:300px;border:2px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);background:#fff}
.evt .top{background:var(--sun);border-bottom:2px dashed var(--ink);padding:12px 14px;display:flex;gap:12px;align-items:center}
.evt .top em{font-style:normal;font-size:34px;line-height:1}
.evt .top small{font-size:12px;font-weight:800;display:block}
.evt .top b{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.05;display:block}
.evt .bot{padding:10px 14px 12px}
.evt .when{font-size:15px;font-weight:700}
.evt .where{font-size:14px;color:var(--ink2)}
.evt .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.evt .going{font-size:13.5px;font-weight:700}
.pill{height:38px;padding:0 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;font-size:14.5px;display:grid;place-items:center;box-shadow:2px 2px 0 var(--tomato)}
.sys{align-self:center;font-size:12.5px;font-weight:600;color:var(--ink2);border:1.5px dashed #BDBAB2;border-radius:10px;padding:3px 10px;margin-top:6px}
.composer{position:absolute;left:12px;right:12px;bottom:26px;height:56px;border:2px solid var(--ink);border-radius:20px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 6px;box-shadow:var(--hard)}
.composer .add{width:42px;height:42px;border-radius:13px;background:var(--sun);border:2px solid var(--ink);display:grid;place-items:center}
.composer .ph{flex:1;font-size:16px;color:#8A867E;font-weight:500}
.composer .send{width:42px;height:42px;border-radius:13px;background:var(--ink);display:grid;place-items:center}
/* desktop */
.desk .search{top:24px;left:24px;right:auto;width:420px}
.desk .note{top:90px;left:24px}
.desk .card{left:24px;right:auto;bottom:24px;width:420px}
.side{position:absolute;top:0;right:0;bottom:0;width:400px;background:#fff;border-left:2px solid var(--ink);z-index:12;padding:28px 24px}
.side h3{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1}
.side p{font-size:15px;color:var(--ink2);margin-top:6px}
.side .tix{margin-top:14px;box-shadow:3px 3px 0 var(--ink)}
.side .host{position:absolute;left:24px;right:24px;bottom:24px}
</style></head>
<body><div id="app"></div>
<script>
const P = { land:'#FFFFFF', water:'#D9E3FF', park:'#E3F4E9', building:'#F2F1EE', road:'#EAE8E3', casing:'#EAE8E3', rail:'#E4E2DD' };
const COL = { graca:'#FFC933', alfama:'#FF5533', mouraria:'#9B7BFF', baixa:'#3355FF', chiado:'#FF8AD0', bairro:'#22C58B', principe:'#5EC8FF', anjos:'#FF9A1F' };
const AV = { 'Inês':'#FF8AD0','Tomás':'#22C58B','Carla':'#5EC8FF','Rui':'#FF9A1F','Ana':'#9B7BFF','Marta':'#FFC933','João':'#22C58B' };
const I = {
  search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  lock:'<svg width="18" height="18" style="flex:none;margin-top:1px" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
  plus:'<svg width="12" height="12" viewBox="0 0 12 12" stroke="#141414" stroke-width="2.4" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg>',
  x:'<svg width="12" height="12" viewBox="0 0 12 12" stroke="#141414" stroke-width="2.4" stroke-linecap="round"><path d="m2 2 8 8M10 2l-8 8"/></svg>',
  back:'<svg width="11" height="18" viewBox="0 0 12 20" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>',
  send:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5.5 11.5 12 5l6.5 6.5"/></svg>',
};
const app = document.getElementById('app');
const s = C.screen, desk = C.desk;
if (desk) app.classList.add('desk');

function stripes(color) {
  const n = 16, cv = document.createElement('canvas'); cv.width = cv.height = n * 2;
  const g = cv.getContext('2d'); g.scale(2, 2); g.fillStyle = color; g.fillRect(0, 0, n, n);
  g.strokeStyle = '#141414'; g.lineWidth = 1.6;
  for (let k = -n; k <= n * 2; k += 8) { g.beginPath(); g.moveTo(k, 0); g.lineTo(k + n, n); g.stroke(); }
  return g.getImageData(0, 0, n * 2, n * 2);
}

function blobLayers(map, opt) {
  map.addImage('home', stripes(COL.graca), { pixelRatio: 2 });
  const feats = C.areas.map(a => C.poly(C.blob(a, a.empty ? 150 : 175 + Math.min(40, a.members / 15)), { id: a.id, empty: a.empty ? 1 : 0, mine: a.mine ? 1 : 0, col: COL[a.id] || '#fff', sel: a.id === opt.sel ? 1 : 0 }));
  map.addSource('blobs', { type: 'geojson', data: C.fc(feats) });
  map.addLayer({ id: 'b-fill', type: 'fill', source: 'blobs', filter: ['all', ['==', ['get', 'empty'], 0], ['==', ['get', 'mine'], 0]], paint: { 'fill-color': ['get', 'col'], 'fill-opacity': 0.9 } });
  map.addLayer({ id: 'b-home', type: 'fill', source: 'blobs', filter: ['==', ['get', 'mine'], 1], paint: { 'fill-pattern': 'home' } });
  map.addLayer({ id: 'b-line', type: 'line', source: 'blobs', filter: ['==', ['get', 'empty'], 0], paint: { 'line-color': '#141414', 'line-width': ['case', ['==', ['get', 'mine'], 1], 3.5, ['==', ['get', 'sel'], 1], 3.5, 2] } });
  map.addLayer({ id: 'b-empty', type: 'line', source: 'blobs', filter: ['==', ['get', 'empty'], 1], paint: { 'line-color': '#141414', 'line-width': ['case', ['==', ['get', 'id'], opt.build || ''], 3, 1.6], 'line-dasharray': [2, 2] } });
  if (opt.build) map.addLayer({ id: 'b-new', type: 'fill', source: 'blobs', filter: ['==', ['get', 'id'], opt.build], paint: { 'fill-color': '#FF5533', 'fill-opacity': 0.9 } }, 'b-empty');
}

function stickers(map, opt) {
  for (const a of C.areas) {
    if (a.empty) {
      if (a.id === opt.build) C.marker(map, a.c, `<div class="tag home" style="box-shadow:3px 3px 0 #FF5533"><b>Your new spot</b><span style="color:#FFB3A3">Name it below</span></div>`);
      else if (!opt.quiet) C.marker(map, a.c, `<div class="build">${I.plus}Build</div>`);
      continue;
    }
    if (a.mine) C.marker(map, a.c, `<div class="tag home"><b>${a.name}, your area</b><span>${a.now} here now</span></div>`);
    else C.marker(map, a.c, `<div class="tag ${a.id === opt.sel ? 'sel' : ''}"><b>${a.name}</b><i>${a.now}</i></div>`);
  }
  if (!opt.noEvents) for (const [k, e] of C.events.entries())
    C.marker(map, e.at, `<div class="emo" style="transform:rotate(${[-8, 6, -4, 9, -6, 4][k]}deg)">${e.emoji}<small>${e.day} ${e.short}</small></div>`);
}

function tix(e) {
  return `<div class="tix"><div class="stub" style="background:${COL[e.area]}"><em>${e.emoji}</em><b>${e.day} ${e.date}</b></div><div class="info"><b>${e.title}</b><span>${e.time}, ${e.place}</span><span style="color:#141414;font-weight:700">${e.going} going</span></div></div>`;
}

function peek(a) {
  const e = C.events.find(x => x.area === a.id);
  return `<div class="card">
    <div class="chead"><div><h2>${a.name}</h2><div class="now"><span class="sw" style="background:${COL[a.id]}"></span><b>${a.members}</b> neighbours</div></div>
      <div class="big" style="background:${COL[a.id]};color:#fff"><div><b>${a.now}</b><span>here<br>now</span></div></div></div>
    <div class="say"><div class="av" style="background:${AV[a.post.who] || '#FFC933'}">${C.initials(a.post.who)}</div><div class="bub"><small>${a.post.who}, ${a.post.ago} ago</small>${a.post.text}</div></div>
    ${e ? tix(e) : ''}
    <div class="btns"><div class="btn ink">Join ${a.name}</div><div class="btn small">${I.x}</div></div></div>`;
}

function buildCard(a) {
  return `<div class="card tall">
    <div class="chead"><h1>Build your<br>neighbourhood</h1><div class="x">${I.x}</div></div>
    <div class="lede">Nobody has started this one. Start it and you're the founder.</div>
    <div class="lbl">Name</div><div class="in">${a.name}<span class="caret"></span></div>
    <div class="lbl">Colour on the map</div>
    <div class="sws"><div class="on" style="background:#FF5533"></div><div style="background:#FFC933"></div><div style="background:#22C58B"></div><div style="background:#3355FF"></div><div style="background:#FF8AD0"></div><div style="background:#9B7BFF"></div></div>
    <div class="priv">${I.lock}<div>Neighbours see <b>someone in ${a.name}</b>. Your exact spot never leaves your phone.</div></div>
    <div class="btns"><div class="btn tomato">Build it</div></div></div>`;
}

async function mapScreen() {
  app.innerHTML = (desk ? '' : C.statusBar(false)) + '<div id="map"></div>' +
    `<div class="search">${I.search}<span class="grow">Find a neighbourhood</span><div class="me">V</div></div>`;
  if (s === '1') app.insertAdjacentHTML('beforeend', `<div class="note">${I.lock}<span>You show up as <b>someone in Graça</b></span></div>`);
  app.insertAdjacentHTML('beforeend', s === '2' ? buildCard(C.byId.penha) : peek(C.byId.alfama));
  if (desk) app.insertAdjacentHTML('beforeend', `<div class="side"><h3>This week<br>around you</h3><p>Events from every neighbourhood on the map.</p>
    ${C.events.slice(0, 5).map(tix).join('')}<div class="host"><div class="btns"><div class="btn tomato">Host an event</div></div></div></div>`);
  const card = document.querySelector('.card');
  const cardTop = card.getBoundingClientRect().top;
  const map = C.newMap('map');
  map.on('load', () => {
    C.restyle(map, P);
    const opt = s === '2' ? { build: 'penha', quiet: true, noEvents: false } : { sel: 'alfama' };
    blobLayers(map, opt); stickers(map, opt);
    const H = innerHeight;
    const view = desk ? { center: [-9.1335, 38.7160], zoom: 14.55, padding: { top: 0, bottom: 0, left: 470, right: 400 } }
      : s === '2' ? { center: [-9.1290, 38.7262], zoom: 14.2, padding: { top: 100, bottom: H - cardTop, left: 0, right: 0 } }
      : { center: [-9.1340, 38.7150], zoom: 14.05, padding: { top: 160, bottom: H - cardTop, left: 0, right: 0 } };
    map.jumpTo(view);
    if (!desk) C.cull(map, 128);
    C.ready([map]);
  });
}

function chatScreen() {
  const a = C.byId[C.room.area], ev = C.events.find(e => e.id === 'e1');
  let h = C.statusBar(false) + `<div class="chat"><div class="ch-top"><div class="back">${I.back}</div><div class="t"><h2>${a.name}</h2><span>${a.members} neighbours, ${a.now} here now</span></div><div class="me" style="background:#fff">G</div></div><div class="msgs">`;
  let prev = null;
  for (const m of C.room.msgs) {
    if (m.event) {
      h += `<div class="who">${m.who} is hosting</div><div class="evt"><div class="top"><em>${ev.emoji}</em><div><small>${ev.day} ${ev.date} Nov</small><b>${ev.title}</b></div></div>
        <div class="bot"><div class="when">${ev.time}</div><div class="where">${ev.place}</div>
        <div class="foot"><span class="going">${ev.going} going</span><div class="pill">I'm going</div></div></div></div>`;
      prev = null; continue;
    }
    if (m.me) { h += `<div class="row mine"><div class="bub">${m.text}</div></div>`; prev = 'me'; continue; }
    if (prev !== m.who) h += `<div class="who">${m.who}</div>`;
    h += `<div class="row"><div class="av" style="background:${AV[m.who]}">${C.initials(m.who)}</div><div class="bub">${m.text}</div></div>`;
    prev = m.who;
  }
  h += `<div class="sys">Someone in ${a.name} just joined</div></div>
    <div class="composer"><div class="add">${I.plus}</div><div class="ph">Say hi to ${a.name}</div><div class="send">${I.send}</div></div></div>`;
  app.innerHTML = h;
  C.ready([]);
}
s === '3' ? chatScreen() : mapScreen();
</script></body></html>
